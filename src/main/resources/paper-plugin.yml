name: AuthMeBia
description: A addons for authme reload that allows players have a expermental dialog login/register.
version: '0.1.1'
folia-supported: true
main: com.authmebia.AuthMeBia
loader: com.authmebia.loader.AuthMeBiaLoader
api-version: '1.21'
load: POSTWORLD

authors: [mytai20100]
website: github.com/mytai20100/authmebia

dependencies:
  server:
    AuthMe:
      load: BEFORE
      required: true
      join-classpath: true

permissions:
  authmebia.bypass:
    description: Add or remove players from the dialog bypass list (/bia add, /bia rm)
    default: op
  bia.admin.recover:
    description: Force a player's password reset on next login (/bia recover)
    default: op
  bia.admin.debug:
    description: Simulate AuthMe API feature states in-game for testing (/bia debug)
    default: op
  authmebia.look:
    description: Look up IP or player information (/bia look)
    default: op
  authmebia.settings:
    description: Edit common AuthMeBia settings in a dialog (/bia settings)
    default: op
  authmebia.config:
    description: Edit config.yml in a dialog (/bia config)
    default: op
  authmebia.titles:
    description: Preview custom titles for online players (/bia titles)
    default: op
  authmebia.update:
    description: Receive in-game notifications about new AuthMeBia releases
    default: op
