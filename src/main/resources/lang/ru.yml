# AuthMeBia language file - Russian
# Supports full MiniMessage: <red>, <gold>, <bold>, <gradient:red:blue>, etc.
# Placeholders: {player} = player name, {player_ip} = player IP address

# Disconnect / kick messages (shown in the disconnect screen)
disconnect:
  verification_failed: "<red>Проверка не удалась."
  registration_cancelled: "<red>Регистрация отменена."
  must_agree_rules: "<red>Вы должны согласиться с правилами сервера."
  login_failed: "<red>Не удалось войти."
  already_connecting: "<red>Соединение с этим именем уже в процессе. Попробуйте ещё раз через минуту."
  logout: "<gray>Вы были отключены от сервера."
  too_many_attempts: "<red>Слишком много неверных вводов пароля."
  ip_banned: "<red>Ваш IP (<yellow>{player_ip}</yellow>) временно заблокирован из-за слишком большого количества неудачных попыток входа."
  max_registration_exceeded: "<red>Вы превысили максимальное количество регистраций ({count}/{max} {names}) для вашего соединения.</red>"

# In-dialog inline error labels (appended to the input field label)
error:
  wrong_password: "Неверный пароль"
  password_empty: "Пароль не может быть пустым"
  passwords_mismatch: "Пароли не совпадают"
  captcha_incorrect: "Неверный код"

# In-game chat messages (shown to the player after they spawn)
message:
  wrong_password: "<red>Неверный пароль."
  password_empty_or_mismatch: "<red>Пароль пуст или не совпадает."

