# AuthMeBia language file - French
# Supports full MiniMessage: <red>, <gold>, <bold>, <gradient:red:blue>, etc.
# Placeholders: {player} = player name, {player_ip} = player IP address

# Disconnect / kick messages (shown in the disconnect screen)
disconnect:
  verification_failed: "<red>Échec de la vérification."
  registration_cancelled: "<red>Inscription annulée."
  must_agree_rules: "<red>Vous devez accepter les règles du serveur."
  login_failed: "<red>Échec de la connexion."
  already_connecting: "<red>Une connexion avec ce nom est déjà en cours. Veuillez réessayer dans un instant."
  logout: "<gray>Vous avez été déconnecté du serveur."
  too_many_attempts: "<red>Trop de mots de passe erronés."
  ip_banned: "<red>Votre IP (<yellow>{player_ip}</yellow>) a été temporairement bannie en raison de trop d'échecs de connexion."
  max_registration_exceeded: "<red>Vous avez dépassé le nombre maximum d'inscriptions ({count}/{max} {names}) pour votre connexion.</red>"

# In-dialog inline error labels (appended to the input field label)
error:
  wrong_password: "Mot de passe incorrect"
  password_empty: "Le mot de passe ne peut pas être vide"
  passwords_mismatch: "Les mots de passe ne correspondent pas"
  captcha_incorrect: "Code incorrect"

# In-game chat messages (shown to the player after they spawn)
message:
  wrong_password: "<red>Mot de passe incorrect."
  password_empty_or_mismatch: "<red>Le mot de passe est vide ou ne correspond pas."

