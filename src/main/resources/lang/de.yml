# AuthMeBia language file - German
# Supports full MiniMessage: <red>, <gold>, <bold>, <gradient:red:blue>, etc.
# Placeholders: {player} = player name, {player_ip} = player IP address

# Disconnect / kick messages (shown in the disconnect screen)
disconnect:
  verification_failed: "<red>Verifizierung fehlgeschlagen."
  registration_cancelled: "<red>Registrierung abgebrochen."
  must_agree_rules: "<red>Du musst den Serverregeln zustimmen."
  login_failed: "<red>Anmeldung fehlgeschlagen."
  already_connecting: "<red>Eine Verbindung mit diesem Namen läuft bereits. Bitte versuche es gleich erneut."
  logout: "<gray>Du wurdest vom Server getrennt."
  too_many_attempts: "<red>Zu viele falsche Passworteingaben."
  ip_banned: "<red>Deine IP (<yellow>{player_ip}</yellow>) wurde wegen zu vieler fehlgeschlagener Anmeldeversuche vorübergehend gesperrt."
  max_registration_exceeded: "<red>Du hast die maximale Anzahl Registrierungen ({count}/{max} {names}) für deine Verbindung überschritten.</red>"

# In-dialog inline error labels (appended to the input field label)
error:
  wrong_password: "Falsches Passwort"
  password_empty: "Passwort darf nicht leer sein"
  passwords_mismatch: "Passwörter stimmen nicht überein"
  captcha_incorrect: "Falscher Code"

# In-game chat messages (shown to the player after they spawn)
message:
  wrong_password: "<red>Falsches Passwort."
  password_empty_or_mismatch: "<red>Passwort ist leer oder stimmt nicht überein."

