# AuthMeBia language file - English
# Supports full MiniMessage tags: <red>, <gold>, <bold>, <gradient:red:blue>, etc.
# Placeholders: {player} = player name, {player_ip} = player IP address

# Disconnect / kick messages (shown in the disconnect screen)
disconnect:
  verification_failed: "<red>Verification failed."
  registration_cancelled: "<red>Registration cancelled."
  must_agree_rules: "<red>You must agree to the rules."
  login_failed: "<red>Login failed."
  already_connecting: "<red>A connection with this name is already in progress. Please try again shortly."
  logout: "<gray>You have been disconnected."
  too_many_attempts: "<red>Too many failed login attempts."
  ip_banned: "<red>Your IP (<yellow>{player_ip}</yellow>) has been temporarily banned due to too many failed login attempts."

# In-dialog inline error labels (appended to the input field label)
error:
  wrong_password: "Wrong password"
  password_empty: "Password cannot be empty"
  passwords_mismatch: "Passwords do not match"
  captcha_incorrect: "Incorrect code"

# In-game chat messages (shown to the player after they spawn)
message:
  wrong_password: "<red>Wrong password."
  password_empty_or_mismatch: "<red>Password is empty or does not match."

update:
  prefix: "<gold>[AuthMeBia]</gold>"
  new_available: "<yellow>A new AuthMeBia version is available: <white>{latest}</white></yellow>"
  download: "<gray>Click to open the download page.</gray>"
  console_outdated: "AuthMeBia {current} is outdated; latest release is {latest}: {url}"
  console_up_to_date: "AuthMeBia is up to date ({current})."

look:
  usage: "<gray>Usage: /bia look IP or player name</gray>"
  invalid_target: "<red>Invalid IP address or player name.</red>"
  rate_limited: "<red>Please wait a moment before using /bia look again.</red>"
  looking_up: "<gray>Looking up {target}...</gray>"
  lookup_failed: "<red>Lookup failed: {reason}</red>"
  private_ip: "<red>{ip} is a private or reserved address; it was not looked up.</red>"
  header_ip: "<gold>IP info for <white>{ip}</white></gold>"
  header_player: "<gold>Player info for <white>{player}</white></gold>"
  field_asn: "<gray>ASN: <white>{value}</white></gray>"
