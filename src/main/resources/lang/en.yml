  field_anycast: "<gray>Anycast: <white>{value}</white></gray>"
  field_uuid: "<gray>UUID: <white>{value}</white></gray>"
  field_type: "<gray>Type: <white>{value}</white></gray>"
  field_mobile: "<gray>Mobile: <white>{value}</white></gray>"
  field_proxy: "<gray>Proxy: <white>{value}</white></gray>"
