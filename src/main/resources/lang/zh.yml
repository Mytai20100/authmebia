# AuthMeBia language file - Chinese (Simplified)
# Supports full MiniMessage: <red>, <gold>, <bold>, <gradient:red:blue>, etc.
# Placeholders: {player} = player name, {player_ip} = player IP address

# Disconnect / kick messages (shown in the disconnect screen)
disconnect:
  verification_failed: "<red>验证失败。"
  registration_cancelled: "<red>注册已取消。"
  must_agree_rules: "<red>您必须同意服务器规则。"
  login_failed: "<red>登录失败。"
  already_connecting: "<red>已有一个同名连接正在进行中，请稍后再试。"
  logout: "<gray>您已断开与服务器的连接。"
  too_many_attempts: "<red>密码输入错误次数过多。"
  ip_banned: "<red>您的 IP（<yellow>{player_ip}</yellow>）因密码输入错误次数过多已被临时封禁。"
  max_registration_exceeded: "<red>您已超过当前连接的注册数量上限（{count}/{max} {names}）。</red>"

# In-dialog inline error labels (appended to the input field label)
error:
  wrong_password: "密码错误"
  password_empty: "密码不能为空"
  passwords_mismatch: "两次密码不一致"
  captcha_incorrect: "验证码错误"

# In-game chat messages (shown to the player after they spawn)
message:
  wrong_password: "<red>密码错误。"
  password_empty_or_mismatch: "<red>密码为空或不一致。"

