# AuthMeBia configuration.
# Text fields support full MiniMessage formatting, including:
#   Colors:      <red>, <gold>, <#4287f5>, <gradient:red:blue>, <rainbow>
#   Decorations: <bold>, <italic>, <underlined>, <strikethrough>, <obfuscated>
#   Font:        <font:minecraft:alt>text</font>
#   Hover:       <hover:show_text:'tooltip'>text</hover>
#   Click:       <click:open_url:'https://...'>text</click>
#   Keybind:     <key:jump>
# Use {player} as a placeholder for the player's name where supported.
# Use \n inside a string to insert a line break.

# Language code for messages (disconnect/kick, errors, chat).
# Built-in options: en (English), vi (Vietnamese).
# To add your own, copy plugins/AuthMeBia/lang/en.yml to lang/<code>.yml and edit it.
# Reload with /bia reload.
lang: en

# Bypass list: players added with /bia add <player> (alias of /authmebia add)
# never see any AuthMeBia dialog (captcha, register, login, or rule) and
# authenticate with AuthMe's own plain /login and /register commands
# instead. Remove a player with /bia rm <player>. This list has no key
# here in config.yml -- it is stored per player under
# plugins/AuthMeBia/data/<uuid>/player.yml, and managed entirely through
# those two commands. See doc/README.md for the full file format.

# Automatic authentication skip for already-verified identities.
# Both flags default to false. With both false, behavior is identical to not
# having this section at all.
auto:
  # If true, a connecting Java player whose current UUID matches the premium
  # UUID already stored on their AuthMe account (see AuthMe's own
  # settings.enablePremium premium-conversion feature) skips the register/
  # login dialog entirely and is logged in automatically. This reuses
  # AuthMe's own premium-UUID match check; it does not introduce a new way
  # to determine who counts as premium. If the UUID does not match, the
  # player falls through to the normal dialog with no indication that a
  # premium check happened.
  #
  # On the player's first join via this path, they are shown a mandatory
  # password-reset dialog (see dialog.premium below) so their AuthMe
  # password is not left as whatever placeholder was used internally.
  premium_autologin: false

  # If true, a connecting Bedrock player (via Geyser/Floodgate) skips the
  # register/login dialog automatically. How that identity is trusted is
  # controlled by bedrock_mode below.
  #
  # Requires Floodgate to be installed. If Floodgate is missing, this has no
  # effect and the player falls through to the normal dialog (or the
  # Bedrock dialog variant below).
  #
  # On the player's first join via this path, they are shown the same
  # mandatory password-reset dialog as premium_autologin.
  bedrock_autologin: false

  # Which identity check bedrock_autologin trusts. Only has any effect if
  # bedrock_autologin is true.
  #
  #   link   (default) - Only trust a Bedrock connection if Floodgate
  #                       reports the account as linked to a verified Java
  #                       premium account (the player used Floodgate's own
  #                       /linkaccount flow, or was auto-linked by
  #                       Floodgate's own auto-link configuration). Being a
  #                       Floodgate player by itself is NOT treated as proof
  #                       of identity and never triggers this skip on its
  #                       own, since Floodgate does not re-verify Xbox Live
  #                       ownership on every join, only at link time. This
  #                       is the safe option.
  #
  #   geyser            - Trust ANY connection Floodgate reports as a
  #                       Bedrock/Geyser player, with no linked-account
  #                       requirement at all.
  #                       WARNING: THIS IS NOT SAFE by itself. Floodgate can
  #                       be configured to accept Bedrock connections
  #                       without verifying the player's Xbox Live account
  #                       (Geyser's "offline"/auth-type: offline mode), in
  #                       which case a Bedrock player's identity is
  #                       whatever they claim it to be, the same as a
  #                       cracked Java client. If you use this mode, you
  #                       should also enable Geyser's own online
  #                       authentication (auth-type: online in Geyser's
  #                       config.yml) so Bedrock players actually go
  #                       through real Xbox Live sign-in before ever
  #                       reaching this plugin. Without that, this mode
  #                       lets anyone auto-login as any Bedrock identity.
  bedrock_mode: link

  # If true, and AuthMe's own session feature would authenticate a
  # returning player automatically (see settings.sessions.enabled and
  # settings.sessions.timeout in AuthMe's own config.yml -- when enabled, a
  # player who logs in successfully is remembered by IP, and reconnecting
  # with the same IP within the timeout skips needing to log in again),
  # AuthMeBia skips its register/login dialog entirely for that join.
  #
  # This reproduces AuthMe's own session comparison (matching IP and
  # timeout against the player's last recorded login) rather than asking
  # AuthMe whether it already decided the player is authenticated --
  # AuthMe does not actually evaluate its session feature until later in
  # the join than AuthMeBia's dialog decision is made, so there is nothing
  # yet to ask at that point. It has no effect at all unless AuthMe's own
  # settings.sessions.enabled is also true; if that is false (the AuthMe
  # default), this flag does nothing.
  #
  # Default: true. When true, a returning player within an active AuthMe
  # session skips AuthMeBia's dialog entirely, matching AuthMe's own
  # pre-join dialog session-skip behavior.
  session_autologin: true

dialog:
  # Master switch for the register/login dialog feature.
  enabled: true

  # If true, the dialog is shown during the configuration phase, before the
  # player fully joins the world (blocks join until submitted).
  # If false, the dialog is shown right after the player spawns in-game instead.
  menu: true

  # Minimum client protocol version required to show the register/login
  # dialog. Dialogs are a vanilla feature added in Minecraft 1.21.6
  # (protocol 771); older clients cannot render dialog packets at all, so
  # forcing one on them just leaves their connection stuck instead of
  # showing an error.
  #
  # This check applies to both dialog paths: the pre-spawn dialog (menu:
  # true) and the in-game/post-spawn dialog (menu: false). If a connecting
  # client's protocol version is below this number, every AuthMeBia dialog
  # (captcha, register, login, rule) is skipped entirely for that player and
  # they join normally, using AuthMe's own /login and /register commands
  # instead (the regular AuthMe behavior with no dialog involved).
  #
  # This check only has an effect if ViaVersion (or a fork) is installed,
  # since that is what allows clients on a different protocol version to
  # connect in the first place. Without ViaVersion, every client is already
  # on the server's own version, so this setting has no effect.
  #
  # Common protocol numbers, for reference:
  #   771 = 1.21.6 (first version with dialog support)
  #   772 = 1.21.7 / 1.21.8
  #   773 = 1.21.9
  #   774 = 1.21.11
  # Full list: https://minecraft.wiki/w/Protocol_version
  min_protocol_version: 771

  # DEPRECATED / no longer used. The dialog-capability check now follows
  # AuthMe 6.0.0's approach: a single synchronous ViaVersion query that fails
  # OPEN (shows the dialog) when the version can't be resolved, instead of the
  # old bounded-wait poll that failed closed on a timing hiccup. This key is
  # kept only so existing configs don't error; it has no effect.
  protocol_detect_wait_ms: 500

  # Width in pixels of the main action buttons (Register/Login/Agree/Logout).
  # Valid range: 1-1024.
  button_width: 200

  # Arrangement of the main action buttons (Register/Login/Forgot Password/
  # Agree/Logout, plus link buttons when links.position is not "separated")
  # inside the register and login dialogs.
  # vertical:   buttons are stacked one per row (default, current behavior).
  # horizontal: buttons are placed side by side in a single row.
  # Applies consistently to both the login dialog (Login, Forgot Password,
  # Logout) and the register dialog (Register, Logout), since both share the
  # same buildType() layout logic.
  button_layout: vertical

  # Width in pixels of the text input fields (password/confirm password).
  # Valid range: 1-1024.
  input_width: 200

  # Bedrock (Geyser/Floodgate) players use the exact same register/login/
  # recover/rule/captcha dialogs as Java players by default; the settings
  # above this line apply to both. These extra keys let you override a few
  # Bedrock-specific details, since Bedrock's dialog renderer has a smaller
  # usable button/text area on some devices. Leave enabled: false to keep
  # everything identical between Java and Bedrock.
  bedrock:
    # If true, the overrides below are applied for players detected as
    # Bedrock (via Floodgate). If false, Bedrock players use the normal
    # dialog.* settings unchanged.
    enabled: false

    # Overrides dialog.button_width for Bedrock players only.
    button_width: 300

    # Overrides dialog.input_width for Bedrock players only.
    input_width: 300

    # Overrides auth_mode.mode for Bedrock players only. Empty string means
    # "use the same auth_mode.mode as Java players" (default).
    # Options: "" (inherit), password, pin, slider
    auth_mode_override: ""

  register:
    # Title shown at the top of the registration dialog. Place
    # <icons:name> anywhere in this string to show a custom_icons entry
    # inline (see "custom_icons:" above) — position is entirely up to you.
    title: "<icons:trial_key> <#4287f5>Create Account</#4287f5>"
    # Body text shown above the input fields. Leave empty for no body text.
    content: "<gray>Welcome, {player}! Please create a password to register.</gray>"
    # Label for the password input field.
    password_label: "Password"
    # Label for the confirm-password input field.
    confirm_password_label: "Confirm Password"
    # Sound played when clicking the Register/Submit button.
    submit_sound: ""

  login:
    # Title shown at the top of the login dialog. Place <icons:name>
    # anywhere in this string to show a custom_icons entry inline (see
    # "custom_icons:" above) — position is entirely up to you.
    title: "<icons:trial_key> <gold>Login</gold>"
    # Body text shown above the password field.
    content: "<gold>Welcome back, {player}!</gold>"
    # Label for the password input field.
    password_label: "Password"
    # Sound played when clicking the Login/Submit button.
    submit_sound: ""

    forgot_password:
      # Master switch for the self-service "Forgot Password?" button on the
      # login dialog. Requires email verification to be usable: the flow
      # looks up the email already stored on the account (set during
      # registration when email.enabled is true) and emails a reset code to
      # it via the same AuthMe SMTP settings used by email.* above. If the
      # account has no email on file, the player is told to contact an admin
      # instead, and nothing is sent.
      enabled: false

      # Label of the "Forgot Password?" button shown next to Login.
      button: "<yellow>Forgot Password?</yellow>"
      # Sound played when clicking the Forgot Password button.
      button_sound: ""

      # Title of the email-entry dialog (also reused for the "no email on
      # file" notice dialog).
      email_title: "<gold>Forgot Password</gold>"
      # Body text of the email-entry dialog. Supports MiniMessage and \n.
      email_content: "<gray>Enter the email address registered to this account.</gray>"
      # Label of the email input field.
      email_label: "Email"
      # Label of the button that submits the entered email and sends the
      # reset code.
      submit_button: "<green>Send Code</green>"
      # Sound played when clicking the Send Code button.
      submit_sound: ""
      # Error shown inline in the email field when the entered address is
      # not a valid email, or does not match the one on file.
      invalid_email_error: "Incorrect email"
      # Message shown (in place of the email field) when the account has no
      # email on file. Supports MiniMessage.
      no_email_message: "<red>No email is linked to this account. Please contact an admin.</red>"

  # Label of the button that disconnects the player instead of submitting.
  logout_button: "<red>Logout</red>"
  # Sound played when clicking the Logout button in any auth dialog.
  # Format: "namespace:sound.name" or "namespace:sound.name volume pitch"
  logout_sound: ""

  # Label of the button that submits the registration form.
  submit_register_button: "<green>Register</green>"

  # Label of the button that submits the login form.
  submit_login_button: "<green>Login</green>"

  # If false, the dialog cannot be dismissed with the escape key, and if it
  # is dismissed some other way (e.g. opening another screen), it is
  # re-opened shortly after (see reopen_delay_ticks below). This prevents
  # bypassing auth by closing the dialog. Only applies when dialog.menu is
  # false (post-spawn mode); in pre-spawn mode (menu: true) the dialog
  # already blocks the connection, so this setting has no effect there.
  #
  # Note on how the reopen is detected: the Minecraft dialog protocol has
  # no packet for "the player closed this dialog" -- the server is only
  # ever told about button clicks, never about a dismissal with no click.
  # So this cannot react the instant the dialog closes; instead it checks
  # again after reopen_delay_ticks and re-shows the dialog if the player is
  # still unauthenticated. A player who is quick can therefore be
  # dialog-free for up to that many ticks after closing it, but cannot
  # actually do anything in that window since AuthMe itself still blocks
  # movement/actions/commands for unauthenticated players.
  allow_close: true

  # Delay, in ticks (20 ticks = 1 second), before checking whether an
  # in-game dialog with allow_close: false above is still supposed to be on
  # screen, and re-showing it if the player closed it without clicking a
  # button. Only used when allow_close is false. Valid range: 1-200.
  reopen_delay_ticks: 10

# Authentication input mode. Lets players authenticate with a numeric PIN or
# a per-digit slider grid instead of typing a password. The chosen mode
# applies to BOTH the register and login dialogs. State for pin/slider entry
# is tracked server-side per player UUID (never sent to the client as hidden
# dialog fields).
#
# Clients whose protocol version is below dialog.min_protocol_version cannot
# render dialog packets at all (dialogs are a vanilla 1.21.6+ feature). If
# mode is pin or slider, those clients automatically get an inventory-GUI
# numpad (a chest-style menu with number items) as a fallback instead, since
# there is no way to type a PIN/slider code through AuthMe's plain chat
# commands. This fallback only applies post-spawn (dialog.menu: false or
# after a pre-spawn dialog would otherwise be skipped); mode: password is
# unaffected, since AuthMe's own /login and /register commands already work
# for plain passwords regardless of client version. Nothing to configure
# here -- this activates automatically whenever it's needed.
auth_mode:
  # Auth input mode for login and register dialogs.
  # Options:
  #   password - standard text input (current behavior, no change)
  #   pin      - numeric PIN entry using a 3-column button grid (numpad)
  #   slider   - numeric code entry using per-digit +/- buttons
  mode: password

  pin:
    # Number of digits in the PIN. Valid range: 4-8.
    length: 4
    # Title of the PIN entry dialog. Supports MiniMessage.
    title: "<gold>Enter your PIN</gold>"
    # Label of the confirm button.
    confirm_button: "<green>Confirm</green>"
    # Label of the delete-last-digit button.
    delete_button: "<red>⌫ Delete</red>"
    # Width in pixels of the numpad buttons (digits, delete, confirm).
    # Valid range: 1-1024. Lower this to make the numpad more compact.
    button_width: 100
    # Sound played when clicking any PIN numpad button (digits, delete, confirm).
    button_sound: ""

  slider:
    # Number of digits in the slider code. Valid range: 4-8.
    length: 4
    # Title of the slider entry dialog. Supports MiniMessage.
    title: "<gold>Enter your code</gold>"
    # Label of the confirm button.
    confirm_button: "<green>Confirm</green>"
    # Width in pixels of the slider buttons (the +/- and digit cells).
    # Valid range: 1-1024.
    button_width: 100
    # Sound played when clicking any slider button (+/-, confirm).
    button_sound: ""

rule:
  # If true, players must accept the server rules (after registering) before
  # they are allowed to join.
  enabled: false

  # Title of the rules dialog.
  title: "<gold>Server Rules</gold>"

  # Body text of the rules dialog. Supports \n for line breaks.
  content: ""

  # Label next to the agreement checkbox.
  checkbox_label: "<yellow>I have read and agree to the rules</yellow>"

  # Label of the button that confirms agreement. The checkbox must be ticked
  # for this to count as agreeing.
  agree_button: "<green>Agree</green>"
  # Sound played when clicking the Agree button in the rules dialog.
  agree_sound: ""

discord:
  # If true, sends a Discord webhook notification (e.g. on player join).
  enabled: false

  # Discord webhook URL to send notifications to. Required if enabled is true.
  webhook_url: ""

welcome_image:
  # If true, sends a welcome image to the player (see welcome.json for the
  # image configuration). For a full guide on customizing the welcome.json
  # canvas layout (background, avatar, text layers, fonts, etc.), see
  # plugins/AuthMeBia/doc/README.md.
  enabled: false

links:
  # Master switch for extra link/utility buttons shown in the dialogs
  # (e.g. Discord invite, copy server IP).
  enabled: false

  # How the link buttons are arranged relative to the main action buttons.
  # grouped:   link buttons are placed together with the main and logout
  #            buttons in a single block.
  # separated: link buttons are placed in their own row, separate from the
  #            logout button.
  position: grouped

  # Default width in pixels for link buttons that don't set their own width.
  # Valid range: 1-1024.
  button_width: 200

  # List of link buttons to display. Each entry supports:
  #   enabled - whether this specific button is shown.
  #   label   - button text, supports MiniMessage tags and {player}.
  #   action  - "open_url" to open a link, or "copy" to copy text/IP to clipboard.
  #   value   - the URL to open, or the text to copy.
  #   width   - button width in pixels, overrides the default button_width above.
  buttons:
    - enabled: true
      label: "<#5865F2>Discord</#5865F2>"
      action: open_url
      value: "https://discord.gg/abc"
      width: 200
    - enabled: true
      label: "<gray>{player}, copy IP</gray>"
      action: copy
      value: "play.example.com"
      width: 200

captcha:
  # Master switch for the captcha dialog. This plugin generates its own
  # captcha code (it does not read AuthMe's internal captcha state, since
  # that is not exposed through AuthMe's public API). The same caveat is
  # documented in the source as a `// CAPTCHA NOTE:` comment in AuthMe.java.
  #
  # When enabled, this also requires AuthMe's own captcha.useCaptcha option
  # to be true in AuthMe's config.yml. If AuthMe has it disabled, the
  # captcha dialog here will not trigger either, even if enabled below is
  # true. This keeps the two plugins' protection settings in sync.
  enabled: false

  # Number of random characters in the generated captcha code.
  # Valid range: 4-10.
  length: 5

  # Title of the captcha dialog.
  title: "<gold>Verification</gold>"

  # Body text of the captcha dialog. Use {code} to show the generated code.
  content: "<gray>Type the code below to continue:</gray>\n<white><bold>{code}</bold></white>"

  # Label of the input field where the player types the code.
  input_label: "Enter code"

  # Label of the button that submits the typed code.
  submit_button: "<green>Verify</green>"
  # Sound played when clicking the Verify button in the captcha dialog.
  submit_sound: ""

  # How long (in seconds) a successful captcha verification is trusted for,
  # so the player isn't asked again on every join during this window.
  # Default: 5 hours (18000 seconds).
  trust_duration_seconds: 18000

login_attempts:
  # If true, kicks the player after too many wrong password attempts in a
  # single login dialog session.
  enabled: true

  # Number of wrong password attempts allowed before the player is kicked.
  max_tries: 5

login_timeout:
  # If true, kicks or re-shows the dialog if the player hasn't authenticated
  # within the time limit after the auth dialog is first shown.
  enabled: true

  # Time in seconds the player has to complete authentication before being
  # kicked. Set to 0 to disable the kick and just re-show the dialog instead.
  # Valid range: 10-3600.
  seconds: 60

  # Kick message shown to the player if they time out. Supports MiniMessage.
  kick_message: "<red>Authentication timed out. Please reconnect.</red>"

recover:
  # Admin-forced password reset. Run /bia recover <player> (permission
  # bia.admin.recover) to flag a player; on their next login (or immediately
  # if they are online) they are shown this two-field reset dialog instead of
  # the normal login dialog. The flag is stored per player under
  # plugins/AuthMeBia/data/<uuid>/player.yml (the same file as the bypass list).

  # Title of the reset dialog. Supports MiniMessage.
  title: "<gold>Reset Password</gold>"

  # Body text of the reset dialog. Supports MiniMessage.
  content: "<gray>An admin has requested you set a new password.</gray>"

  # Label for the new password input field.
  new_password_label: "New password"

  # Label for the confirm password input field.
  confirm_password_label: "Confirm password"

  # Label of the submit button. Supports MiniMessage.
  submit_button: "<green>Set Password</green>"
  # Sound played when clicking the Set Password button.
  submit_sound: ""

  # Message sent to the player (chat) on successful reset.
  # Supports MiniMessage and {player}.
  success_message: "<green>Password updated successfully.</green>"

  # Message sent to the player (chat) if the two fields don't match.
  # Supports MiniMessage.
  mismatch_message: "<red>Passwords do not match. Try again.</red>"

premium:
  # Password-set dialog shown exactly once, the first time a player joins
  # via auto.premium_autologin or auto.bedrock_autologin. AuthMe still needs
  # a password on file for the account internally; this dialog lets the
  # player choose it themselves instead of it being left as an internal
  # placeholder. Has no effect if both auto.premium_autologin and
  # auto.bedrock_autologin are false.

  # Title of the dialog. Supports MiniMessage.
  title: "<gold>Set Your Password</gold>"

  # Body text. Supports MiniMessage and \n.
  content: "<gray>You were signed in automatically. Please set a password for your account (used if you ever join from a non-verified client).</gray>"

  # Label for the new password input field.
  new_password_label: "New password"

  # Label for the confirm password input field.
  confirm_password_label: "Confirm password"

  # Label of the submit button. Supports MiniMessage.
  submit_button: "<green>Set Password</green>"
  # Sound played when clicking the Set Password button.
  submit_sound: ""

  # Message sent to the player (chat) on successful set.
  # Supports MiniMessage and {player}.
  success_message: "<green>Password set successfully.</green>"

  # Message sent to the player (chat) if the two fields don't match.
  # Supports MiniMessage.
  mismatch_message: "<red>Passwords do not match. Try again.</red>"

email:
  # Email verification on registration. When enabled, AuthMeBia adds an email
  # input below the password field; after the player submits the register form
  # a code is emailed to them and they must enter it in a verify dialog before
  # the account is created.
  #
  # This only takes effect if AuthMe Reloaded itself has email/SMTP configured
  # (Email.mailAccount + Email.mailPassword + Email.mailSMTP in AuthMe's
  # config.yml). AuthMeBia reuses AuthMe's SMTP settings to send the code, so
  # there is no separate SMTP config here. If AuthMe has no email configured,
  # this feature stays off even when enabled is true.
  #
  # Only applies to auth_mode: password (the email field sits under the password
  # input). PIN/slider modes have no text field and are unaffected.
  enabled: false

  # Number of digits in the emailed verification code. Valid range: 4-8.
  code_length: 6

  # Cooldown in seconds before the player can press Resend again.
  # Valid range: 10-600.
  resend_cooldown: 60

  # Label of the email input field added under the password.
  field_label: "Email"

  # Verify dialog title. Supports MiniMessage.
  verify_title: "<gold>Verify your email</gold>"

  # Verify dialog body. Supports MiniMessage and \n. {email} = the entered
  # email, {cooldown} = seconds remaining before Resend is available.
  verify_content: "<gray>A code was sent to {email}.\nResend available in {cooldown}s.</gray>"

  # Label of the code input field in the verify dialog.
  code_label: "Code"

  # Label of the verify button.
  verify_button: "<green>Verify</green>"
  # Sound played when clicking the Verify button in the email verify dialog.
  verify_sound: ""

  # Label of the resend button (when cooldown has expired).
  resend_button: "<yellow>Resend code</yellow>"
  # Sound played when clicking the Resend button.
  resend_sound: ""

  # Label of the resend button while the cooldown is still active.
  # Use {cooldown} for the remaining seconds.
  resend_button_cooldown: "<gray>Resend ({cooldown}s)</gray>"

  # Messages (chat). Support MiniMessage and {player}.
  # Shown when the entered email is not a valid address.
  invalid_email_message: "<red>Please enter a valid email address.</red>"
  # Shown when the code could not be emailed (SMTP error).
  send_failed_message: "<red>Could not send the email. Please contact an admin.</red>"

  # Error shown inline in the verify dialog when the code is wrong.
  wrong_code_error: "Incorrect code"

totp_2fa:
  # If true, players who have TOTP/2FA enabled in AuthMe will be shown a
  # two-factor authentication dialog after entering their password.
  # Requires AuthMe to have TOTP support (5.6+).
  enabled: false

  # Title of the 2FA dialog. Supports MiniMessage.
  title: "<gold>Two-Factor Authentication</gold>"

  # Body text of the 2FA dialog. Supports MiniMessage and \n.
  content: "<gray>Enter your 6-digit authenticator app code:</gray>"

  # Label of the code input field.
  input_label: "Authenticator code"

  # Label of the verify button. Supports MiniMessage.
  submit_button: "<green>Verify</green>"
  # Sound played when clicking the Verify button in the 2FA dialog.
  submit_sound: ""

  # Error shown inline when the code is wrong.
  wrong_code_error: "Invalid code"

# Named icons that can be placed inline inside ANY MiniMessage string in
# this config (titles, content, button labels, custom screen text, etc.)
# using the tag <icons:name> — wherever you put the tag in the string is
# exactly where the icon appears, e.g.:
#   title: "<icons:trial_key> <gold>Login</gold>"
#   title: "<gold>Login</gold> <icons:trial_key>"
#   content: "Welcome!\n<icons:trial_key> Read the rules below."
#
# Each entry below is keyed by its own name (the part after "icons:" in
# the tag) and supports one of three types:
#
#   type: sprite       - an icon from a texture atlas (the same kind of
#                         icon vanilla uses for items/effects in its own
#                         UI). Fields:
#                           atlas  - atlas namespace/path (default "items")
#                           sprite - sprite path, e.g. "item/trial_key"
#   type: player_head  - a player's head. Fields:
#                           player - player name, or "{player}" for the
#                                    viewing player (default "{player}")
#   type: item         - a full item icon (supports custom model data,
#                         enchant glow, etc. via the item itself; this
#                         section only controls the icon's own display).
#                         Fields:
#                           material          - a Bukkit Material name
#                           show_decorations  - show durability/count/etc.
#                                               overlays (default true)
#                           show_tooltip      - show the item tooltip on
#                                               hover (default true)
#                           width, height     - icon size in pixels
#                                               (default 16x16)
#
# IMPORTANT: only sprite and player_head icons can go inline via
# <icons:name> — an item icon has no inline text form, so <icons:name>
# for an "item"-type entry resolves to nothing wherever it's placed. Item
# icons are only usable via a custom_screens "icon:" field (see below),
# which shows them as a small icon above the dialog's content instead.
#
# Anything invalid or missing here — an unknown name, bad sprite/material,
# etc. — is silently treated as "no icon", so a bad tag or a bad entry
# never breaks the surrounding text or the dialog itself.
custom_icons:
  trial_key:
    type: sprite
    atlas: items
    sprite: item/trial_key
  # bedrock:
  #   type: sprite
  #   atlas: items
  #   sprite: item/bedrock
  # my_head:
  #   type: player_head
  #   player: "{player}"
  # red_bed:
  #   type: item
  #   material: RED_BED
  #   show_decorations: false
  #   show_tooltip: false
  #   width: 16
  #   height: 16

# Custom dialog screens — a mini-framework for showing fully custom dialogs.
#
# Show a screen manually: /bia screen <id> [player]
# Reset a player's "closed forever" checkbox for a screen:
#   /bia screen reset <player> [id]   (omit id to reset all screens for that player)
#
# Each screen supports:
#   id              - unique identifier used with /bia screen <id>
#   enabled         - true/false, disables the screen without removing it (default: true)
#   title           - dialog title, supports full MiniMessage
#   content         - dialog body, supports MiniMessage and \n
#   allow_close     - whether the player can dismiss with ESC (default: true)
#   button_width    - default button width in pixels for this screen (default: dialog.button_width)
#   trigger         - when this screen is automatically shown:
#                       command  (default) - only via /bia screen
#                       postjoin           - shown after the player authenticates and spawns in-game
#                       prejoin            - shown during the pre-spawn phase (blocking), after auth
#   sound_on_show   - Minecraft sound played when the screen opens (in-game only).
#                     Format: "namespace:sound.name" or "namespace:sound.name volume pitch"
#                     Example: "minecraft:ui.button.click 1.0 1.0"
#   icon            - optional, name of an "item"-type entry under
#                     "custom_icons:" above, shown as a small icon above
#                     this screen's content. Only for "item"-type entries —
#                     sprite/player_head icons go inline in the title/
#                     content text instead, via the <icons:name> tag (see
#                     "custom_icons:" above).
#   checkbox_label  - optional. If set, a checkbox with this label is shown
#                     in the dialog (supports MiniMessage and {player}).
#                     Whether ticking it does anything depends on
#                     checkbox_action below. Leave unset for no checkbox.
#   checkbox_action - what ticking checkbox_label does when the player
#                     dismisses the screen, for postjoin/prejoin triggers only
#                     ("/bia screen <id>" always shows the screen regardless):
#                       show  (default) - purely cosmetic; the screen shows
#                               again next time it's triggered either way
#                       close           - ticked = never show this screen to
#                               this player again (persisted, survives
#                               restarts). Left unticked = shows again next
#                               time, same as "show".
#                     Only takes effect on a "close", "command", or
#                     "console" button — "open_url" and "copy" buttons never
#                     send the checkbox's value back to the server (a Paper
#                     client-only action), so a checkbox on a screen with
#                     only those button types can never actually fire.
#
# Each button supports:
#   label   - button text, full MiniMessage + {player}
#   action  - close, open_url, copy, command (as player), console (as console)
#   value   - URL/text/command depending on action; supports {player}
#   width   - button width in pixels (overrides button_width)
#   sound   - Minecraft sound played when this button is clicked (in-game only)
#             Format: "namespace:sound.name" or "namespace:sound.name volume pitch"
#
# Use {player} in title, content, and button values/labels as a placeholder.
custom_screens:
  - id: example
    enabled: true
    title: "<icons:trial_key> <gold>Server Notice</gold>"
    content: "<gray>Welcome to the server, <yellow>{player}</yellow>!\nHave fun playing.</gray>"
    allow_close: true
    button_width: 200
    trigger: postjoin
    sound_on_show: ""
    checkbox_label: "<gray>Don't show this again</gray>"
    checkbox_action: close
    buttons:
      - label: "<green>OK</green>"
        action: close
        sound: "minecraft:ui.button.click"
      - label: "<#5865F2>Discord</#5865F2>"
        action: open_url
        value: "https://discord.gg/abc"
        width: 200

  # Example: only shown via /bia screen (command trigger)
  # - id: rules
  #   enabled: false
  #   title: "<gradient:gold:yellow>Server Rules</gradient>"
  #   content: "<gray>Hello, <white>{player}</white>!\nPlease read the rules.</gray>"
  #   allow_close: true
  #   trigger: command
  #   sound_on_show: "minecraft:entity.player.levelup 0.5 1.2"
  #   buttons:
  #     - label: "<green>Understood</green>"
  #       action: close
  #       sound: "minecraft:ui.button.click"
  #     - label: "<aqua>Full Rules</aqua>"
  #       action: command
  #       value: "/rules"

# Custom toast notifications (the small achievement-style popup in the top
# right corner of the screen). Each entry is shown once per matching player
# event.
#
# IMPORTANT client-side limitation: every vanilla advancement toast has two
# lines. The small line above is drawn entirely by the client from the
# "frame" value below and is NOT otherwise configurable -- it always reads
# "Advancement Made!" (frame: task), "Goal Reached!" (frame: goal), or
# "Challenge Complete!" (frame: challenge), translated into the viewing
# player's own client language (e.g. "Da hoan thanh nhiem vu" on a
# Vietnamese client for the task frame). The larger line below is what
# "title" below actually controls. There is no vanilla mechanism to remove
# the small line entirely; this applies to every plugin that uses
# advancement toasts, not just this one.
#
# Each toast supports:
#   name    - unique identifier for this toast (used only for logging)
#   check   - which event triggers this toast. One of:
#               first_register     - the player's very first successful registration
#               first_login        - the player's very first successful login
#               first_message      - the player's first chat message this session
#               first_advancement  - the player's first advancement/achievement this session
#   title   - toast title, supports MiniMessage. Rendered as the larger,
#             bottom line of the toast (see the frame note above for the
#             smaller line above it, which frame controls instead).
#   content - toast description text, supports MiniMessage
#   icon    - Minecraft item id shown on the toast, e.g. minecraft:diamond
#   sound   - Minecraft sound played when the toast appears.
#             Format: "namespace:sound.name" or "namespace:sound.name volume pitch"
#   delay   - how long the toast stays visible, in seconds (approximate)
#   frame   - one of: task, goal, challenge. Controls only the small,
#             client-drawn header line above the title (see the note
#             above); does not affect title or content. Default: task.
#             Changing frame on a toast that already registered earlier in
#             the current server run requires a full restart to take
#             effect (a full restart is also required after changing
#             title/icon/content on an already-registered toast -- this is
#             an existing Bukkit advancement-registration limitation, not
#             specific to frame).
notifications:
  toasts:
    - name: welcome_toast
      check: first_register
      title: "<gold>Welcome!</gold>"
      content: "<gray>Thanks for joining the server.</gray>"
      icon: "minecraft:player_head"
      sound: "minecraft:entity.player.levelup 0.6 1.0"
      delay: 5
      frame: task

# Optional integrations with third-party item/resource-pack plugins. Each
# integration is independent and self-checks whether the target plugin is
# actually installed; if it is not, that integration silently does nothing
# and never affects login/registration.
integrations:
  itemsadder:
    enabled: false
  nexomc:
    enabled: false
  oraxen:
    enabled: false

ip_ban:
  # If true, temporarily bans an IP address after repeated wrong password
  # attempts across login sessions from that IP (spam/brute-force
  # protection). Ban duration escalates with repeated offenses.
  enabled: false

  # Number of wrong password attempts from the same IP (across sessions)
  # before the first temporary ban is issued.
  threshold: 10

  # Ban durations in seconds for each escalation level. The 1st offense
  # uses the 1st value, the 2nd offense uses the 2nd value, and so on.
  # The last value is reused for any further offense beyond the list.
  ban_durations_seconds: [600, 1800, 3600, 86400]

config_version: 2